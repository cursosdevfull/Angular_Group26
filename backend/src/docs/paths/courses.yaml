/api/courses:
  get:
    tags:
      - Courses
    summary: Listar cursos
    description: Retorna una lista paginada de cursos.
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Número de página
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
        description: Cantidad de elementos por página
    responses:
      "200":
        description: Lista de cursos
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseListResponse"
  post:
    tags:
      - Courses
    summary: Crear curso
    description: Crea un nuevo curso.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CourseInput"
    responses:
      "201":
        description: Curso creado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseResponse"
      "400":
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"

/api/courses/{id}:
  get:
    tags:
      - Courses
    summary: Obtener curso por ID
    description: Retorna un curso por su ID.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID del curso
    responses:
      "200":
        description: Curso encontrado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseResponse"
      "404":
        description: Curso no encontrado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
  put:
    tags:
      - Courses
    summary: Actualizar curso
    description: Actualiza un curso existente.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID del curso
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CourseInput"
    responses:
      "200":
        description: Curso actualizado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseResponse"
      "404":
        description: Curso no encontrado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
  delete:
    tags:
      - Courses
    summary: Eliminar curso
    description: Elimina un curso por su ID.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID del curso
    responses:
      "200":
        description: Curso eliminado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseResponse"
      "404":
        description: Curso no encontrado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
