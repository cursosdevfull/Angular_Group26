<h2>Payments for staff</h2>
<form>
    <label for="name">Staff Name:</label>
    <input type="text" id="name" [formField]="form.staffName"><br>
    <label for="amount">Payment Amount:</label>
    <input type="number" id="amount" [formField]="form.paymentAmount"><br>
    <input type="button" value="Submit Payment" [disabled]="form().invalid()" (click)="submitPayment()">
</form>
