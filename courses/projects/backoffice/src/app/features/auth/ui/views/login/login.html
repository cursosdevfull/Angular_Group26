<form autocomplete="off">
    <h1>Credenciales</h1>
        <mat-form-field>
            <mat-label>Correo electrónico</mat-label>
            <input matInput type="email" [formField]="loginForm.email" />
        </mat-form-field>
        <cdev-lib-error-message [control]="loginForm.email()"></cdev-lib-error-message>
        <mat-form-field>
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" [formField]="loginForm.password" />
        </mat-form-field>
        <cdev-lib-error-message [control]="loginForm.password()"></cdev-lib-error-message>
     <button matButton="filled" type="button" (click)="login()">Iniciar sesión</button>
</form>
