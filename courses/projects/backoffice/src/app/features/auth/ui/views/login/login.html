<form class="login-form" autocomplete="off">
    <h1 class="login-title">Iniciar sesión</h1>
    <div class="md3-textfield login-field">
        <input type="email" id="email" name="email" required placeholder=" " (input)="inputEmail($event)" />
        <label for="email">Correo electrónico</label>
        <span class="md3-line"></span>
    </div>
    <div class="md3-textfield login-field">
        <input type="password" id="password" name="password" required placeholder=" " (input)="inputPassword($event)" />
        <label for="password">Contraseña</label>
        <span class="md3-line"></span>
    </div>
    <button class="md3-btn login-btn" type="button" (click)="login()">Iniciar sesión</button>
</form>
