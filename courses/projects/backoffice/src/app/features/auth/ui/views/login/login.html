<form class="login-form" autocomplete="off">
    <h1 class="login-title">Iniciar sesión</h1>
    <div class="md3-textfield login-field">
        <input type="email" id="email" placeholder=" " [formField]="loginForm.email" />
        <label for="email">Correo electrónico</label>
        <cdev-lib-error-message [control]="loginForm.email()"></cdev-lib-error-message>
        <span class="md3-line"></span>
    </div>
    <div class="md3-textfield login-field">
        <input type="password" id="password" placeholder=" " [formField]="loginForm.password" />
        <label for="password">Contraseña</label>
        <cdev-lib-error-message [control]="loginForm.password()"></cdev-lib-error-message>
        <span class="md3-line"></span>
    </div>
    <button class="md3-btn login-btn" type="button" (click)="login()">Iniciar sesión</button>
</form>
