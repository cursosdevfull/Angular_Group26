<form>
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" [formField]="userForm.name">
        <app-error-message [control]="userForm.name()"></app-error-message>
    </div>
    <div class="field">
        <label for="lastname">Lastname</label>
        <input type="text" id="lastname" [formField]="userForm.lastname">
        <app-error-message [control]="userForm.lastname()"></app-error-message>
    </div>
    <div class=" field">
        <label for="email">Email</label>
        <input type="text" id="email" [formField]="userForm.email">
        <app-error-message [control]="userForm.email()"></app-error-message>
    </div>
    <div class="field">
        <label for="age">Edad</label>
        <input type="number" id="age" [formField]="userForm.age">
        <app-error-message [control]="userForm.age()"></app-error-message>
    </div>
    <div class="field"><label for="gender"></label>
        <select id="gender" [formField]="userForm.gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
    </div>
    <button type="button" (click)="onSubmit()">Submit</button>
    <app-error-message [control]="userForm()"></app-error-message>
</form>
